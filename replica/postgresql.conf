# PostgreSQL Replica Configuration
# Overlaid on top of the base backup after pg_basebackup completes.

# Connections
listen_addresses = '*'
port = 5432
max_connections = 100

# Hot standby — allow read queries while streaming WAL
hot_standby = on
hot_standby_feedback = on

# Performance tuning
shared_buffers = 256MB
work_mem = 4MB

# Logging
log_destination = 'stderr'
logging_collector = off
