# PostgreSQL Replica Configuration — PRODUCTION
# Overlaid on top of the base backup after pg_basebackup completes.
# Adjust memory settings to match your actual server hardware.

# Connections
listen_addresses = '*'
port = 5432
max_connections = 100

# TLS — requires certs mounted at the paths below (see PRODUCTION.md)
# ssl = on
# ssl_cert_file = '/etc/ssl/certs/server.crt'
# ssl_key_file = '/etc/ssl/private/server.key'

# Hot standby — allow read queries while streaming WAL
hot_standby = on
hot_standby_feedback = on
max_standby_streaming_delay = 30s

# Memory — same sizing rules as primary
shared_buffers = 2GB
effective_cache_size = 6GB
work_mem = 32MB
maintenance_work_mem = 512MB

# Query planning
random_page_cost = 1.1
effective_io_concurrency = 200

# Logging
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 1000
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_connections = on
log_disconnections = on
log_lock_waits = on
