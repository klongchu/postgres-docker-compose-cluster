services:
  postgres_primary:
    image: postgres:17
    container_name: postgres_primary
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
      - ./primary/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./primary/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./initdb.d/00_init.sh:/docker-entrypoint-initdb.d/00_init.sh:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      REPLICATION_USER: ${REPLICATION_USER:?REPLICATION_USER is required}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?REPLICATION_PASSWORD is required}
      APP_USER: ${APP_USER:-}
      APP_PASSWORD: ${APP_PASSWORD:-}
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - postgres-network

  postgres_replica:
    image: postgres:17
    container_name: postgres_replica
    depends_on:
      postgres_primary:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./replica/postgresql.conf:/etc/replica/postgresql.conf:ro
      - ./replica/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    environment:
      PRIMARY_HOST: postgres_primary
      REPLICATION_USER: ${REPLICATION_USER:?REPLICATION_USER is required}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?REPLICATION_PASSWORD is required}
      REPLICA_SLOT: ${REPLICA_SLOT:-replica_slot_1}
    entrypoint: ["bash", "/replica-entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${REPLICATION_USER}\" -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - postgres-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    env_file:
      - .env
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped
    networks:
      - postgres-network

volumes:
  postgres_primary_data:
  postgres_replica_data:
  pgadmin_data:

networks:
  postgres-network:
    driver: bridge
