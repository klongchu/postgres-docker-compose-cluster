# PostgreSQL Client Authentication Configuration File — PRODUCTION
# TYPE  DATABASE        USER            ADDRESS                 METHOD
#
# SECURITY: this file ships with NO remote access rules. You must add
# explicit rules for your replica IPs and app subnet before the primary
# will accept any non-local connection. Do not use 0.0.0.0/0 in production.

# Local access only (container healthcheck, docker exec psql)
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust

# --- Add one line per replica, restricted to its exact IP ---
# host    replication     replicator      10.0.1.20/32            scram-sha-256
# host    replication     replicator      10.0.1.30/32            scram-sha-256

# --- Add one line per app tier/subnet allowed to connect ---
# host    all             app             10.0.2.0/24             scram-sha-256

# --- Admin access — restrict to a bastion host or VPN range ---
# host    all             postgres        10.0.0.10/32            scram-sha-256
