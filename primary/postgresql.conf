# PostgreSQL Primary Configuration
# Loaded via docker-compose command: postgres -c config_file=/etc/postgresql/postgresql.conf

# Connections
listen_addresses = '*'
port = 5432
max_connections = 100

# Authentication file — mounted from host
hba_file = '/etc/postgresql/pg_hba.conf'

# Replication (primary role)
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
wal_keep_size = 256MB
synchronous_commit = on
password_encryption = scram-sha-256

# Performance tuning
shared_buffers = 256MB
work_mem = 4MB
checkpoint_completion_target = 0.9

# Logging
log_destination = 'stderr'
logging_collector = off
