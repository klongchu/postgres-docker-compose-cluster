# Accept connections from all interfaces — required for Docker networking
listen_addresses = '*'

# Replication
wal_level = replica
max_wal_senders = 3
max_replication_slots = 3
wal_keep_size = 256
synchronous_commit = on

# Performance
shared_buffers = 256MB
work_mem = 4MB
checkpoint_completion_target = 0.9