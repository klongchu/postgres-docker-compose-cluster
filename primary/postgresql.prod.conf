# PostgreSQL Primary Configuration — PRODUCTION
# Copy of primary/postgresql.conf tuned for production workloads.
# Adjust memory settings to match your actual server hardware.

# Connections
listen_addresses = '*'
port = 5432
max_connections = 100

# Authentication file — mounted from host
hba_file = '/etc/postgresql/pg_hba.conf'

# TLS — requires certs mounted at the paths below (see PRODUCTION.md)
# Uncomment once certificates are in place.
# ssl = on
# ssl_cert_file = '/etc/ssl/certs/server.crt'
# ssl_key_file = '/etc/ssl/private/server.key'

# Replication (primary role)
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
wal_keep_size = 1GB
synchronous_commit = on
password_encryption = scram-sha-256

# WAL archiving — enable for point-in-time recovery.
# Requires the /archive volume to be mounted (see docker-compose-primary.prod.yml).
# archive_mode = on
# archive_command = 'test ! -f /archive/%f && cp %p /archive/%f'
# archive_timeout = 300

# Memory — defaults below assume ~8GB RAM. Adjust using:
#   shared_buffers        = 25% of RAM
#   effective_cache_size   = 75% of RAM
#   work_mem               = shared_buffers / max_connections (roughly)
shared_buffers = 2GB
effective_cache_size = 6GB
work_mem = 32MB
maintenance_work_mem = 512MB

# WAL / checkpoint tuning
wal_buffers = 16MB
checkpoint_completion_target = 0.9
max_wal_size = 4GB
min_wal_size = 1GB

# Query planning — defaults assume SSD storage. Use random_page_cost = 4.0 for HDD.
random_page_cost = 1.1
effective_io_concurrency = 200

# Logging
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 1000
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_autovacuum_min_duration = 0
